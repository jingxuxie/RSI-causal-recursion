name: Tests and reproducible source snapshot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source without Git credentials
        run: git archive --format=zip --output=repository-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: repository-source.zip
          retention-days: 14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Run numerical and interpreter checks
        run: python -m pytest -q
