name: Tests, evidence, and manuscript
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source without Git credentials
        run: git archive --format=zip --output=repository-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: repository-source.zip
          retention-days: 14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Run numerical and interpreter checks
        run: python -m pytest -q
      - name: Recompute published confidence intervals
        run: make verify-aggregates
      - name: Install manuscript dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Build manuscript from saved results
        run: make figures paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper-and-verification
          path: |
            paper/main.pdf
            results/trees_aggregate_verification.json
            results/adapter_diagnostic/aggregate_verification.json
          retention-days: 14
